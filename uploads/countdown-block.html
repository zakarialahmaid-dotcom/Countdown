<!-- Jumia Black Friday countdown block: paste this whole snippet into any HTML page. -->
<div class="jbf-cd" data-target="2026-10-30T00:00:00" lang="fr">
  <div class="jbf-angle" aria-hidden="true"></div>
  <div class="jbf-content">
    <span class="jbf-badge">Black Friday</span>
    <h2 class="jbf-title">RDV le <span>30 octobre</span></h2>
    <div class="jbf-timer" role="timer" aria-live="off">
      <div class="jbf-unit"><span class="jbf-num" data-unit="days">00</span><span class="jbf-label">Jours</span></div>
      <div class="jbf-unit"><span class="jbf-num" data-unit="hours">00</span><span class="jbf-label">Heures</span></div>
      <div class="jbf-unit"><span class="jbf-num" data-unit="minutes">00</span><span class="jbf-label">Minutes</span></div>
      <div class="jbf-unit"><span class="jbf-num" data-unit="seconds">00</span><span class="jbf-label">Secondes</span></div>
    </div>
    <p class="jbf-done" hidden>C'est parti ! Le Black Friday a commencé</p>
  </div>
</div>

<style>
  .jbf-cd {
    --jbf-orange: #ff9900;   /* Orange Peel – primary */
    --jbf-yellow: #ffba00;   /* Selective Yellow – Jumia main secondary */
    --jbf-black: #000000;    /* Black Friday campaign colour */
    --jbf-white: #ffffff;
    --jbf-x: 48px;           /* headline size = base unit x */
    position: relative;
    overflow: hidden;
    box-sizing: border-box;
    max-width: 960px;
    margin: 0 auto;
    padding: var(--jbf-x);
    background: var(--jbf-black);
    color: var(--jbf-white);
    font-family: "Helvetica Now Text", Arial, Helvetica, sans-serif;
  }
  .jbf-cd * { box-sizing: border-box; }

  /* Jumia 78.5° angle: skewX(-11.5deg) gives edges at 78.5° from horizontal.
     Kept on the right third so it never crosses the canvas midpoint. */
  .jbf-angle {
    position: absolute;
    top: 0;
    bottom: 0;
    right: -60px;
    width: 30%;
    background: var(--jbf-orange);
    transform: skewX(-11.5deg);
    transform-origin: bottom left;
  }
  .jbf-angle::before {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    left: -18px;
    width: 10px;
    background: var(--jbf-yellow);
  }

  .jbf-content {
    position: relative;
    max-width: 66%;
  }
  .jbf-badge {
    display: inline-block;
    padding: 6px 14px;
    border-radius: 999px;
    background: var(--jbf-orange);
    color: var(--jbf-black);
    font-family: "Helvetica Now Text", Arial, Helvetica, sans-serif;
    font-weight: 700;
    font-size: calc(var(--jbf-x) * 0.33);
    line-height: 1;
    text-transform: uppercase;
  }
  .jbf-title {
    margin: calc(var(--jbf-x) * 0.5) 0 calc(var(--jbf-x) * 0.5);
    font-family: "Helvetica Now Display", "Arial Black", Arial, sans-serif;
    font-weight: 900;
    font-size: var(--jbf-x);
    line-height: 0.95;
    letter-spacing: 0;
    text-transform: uppercase;
    color: var(--jbf-white);
  }
  .jbf-title span { color: var(--jbf-orange); }

  .jbf-timer {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: calc(var(--jbf-x) * 0.25);
  }
  .jbf-unit {
    padding: calc(var(--jbf-x) * 0.33) 4px;
    border-radius: 12px;
    background: var(--jbf-orange);
    color: var(--jbf-black);
    text-align: center;
  }
  .jbf-num {
    display: block;
    font-family: "Helvetica Now Display", "Arial Black", Arial, sans-serif;
    font-weight: 900;
    font-size: var(--jbf-x);
    line-height: 0.95;
    font-variant-numeric: tabular-nums;
  }
  .jbf-label {
    display: block;
    margin-top: 6px;
    font-weight: 700;
    font-size: calc(var(--jbf-x) * 0.25);
    text-transform: uppercase;
  }
  .jbf-done {
    margin: 0;
    font-family: "Helvetica Now Display", "Arial Black", Arial, sans-serif;
    font-weight: 900;
    font-size: calc(var(--jbf-x) * 0.5);
    line-height: 0.95;
    color: var(--jbf-orange);
  }

  @media (max-width: 640px) {
    .jbf-cd { --jbf-x: 32px; padding: 24px 16px; }
    .jbf-content { max-width: none; }
    .jbf-angle { width: 22%; right: -40px; height: 40%; top: 0; bottom: auto; }
    .jbf-label { font-size: 10px; }
  }
</style>

<script>
  (function () {
    document.querySelectorAll(".jbf-cd").forEach(function (block) {
      var target = new Date(block.dataset.target).getTime();
      var nums = {};
      block.querySelectorAll(".jbf-num").forEach(function (el) { nums[el.dataset.unit] = el; });
      var pad = function (n) { return String(n).padStart(2, "0"); };
      var timer;

      function tick() {
        var diff = target - Date.now();
        if (diff <= 0) {
          block.querySelector(".jbf-timer").hidden = true;
          block.querySelector(".jbf-done").hidden = false;
          clearInterval(timer);
          return;
        }
        var s = Math.floor(diff / 1000);
        nums.days.textContent = pad(Math.floor(s / 86400));
        nums.hours.textContent = pad(Math.floor(s / 3600) % 24);
        nums.minutes.textContent = pad(Math.floor(s / 60) % 60);
        nums.seconds.textContent = pad(s % 60);
      }

      timer = setInterval(tick, 1000);
      tick();
    });
  })();
</script>
