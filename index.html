/* Right-hand artwork, clipped along the orange diagonal */
.jbf-art{position:absolute;inset:0;background:var(--jbf-art) 120% 100%/auto 100% no-repeat}
.jbf-logo{position:absolute;right:3cqw;bottom:3cqw;width:9cqw;height:auto;display:block}

.jbf-main{position:relative;z-index:1;height:100%;width:58%;padding:0 0 0 5cqw;display:flex;flex-direction:column;justify-content:center;align-items:flex-start}
.jbf-tag{display:inline-block;padding:.55cqw 1.6cqw .5cqw;border-radius:999px;background:#FE550C;color:#000;font-weight:700;font-size:max(10.5px,1.4cqw);line-height:1;text-transform:uppercase}
.jbf-title{margin:1cqw 0 0;white-space:nowrap;font-family:'Ubuntu',Arial,sans-serif;font-weight:700;font-size:4.6cqw;line-height:1;text-transform:uppercase}
.jbf-title span{display:inline}
.jbf-title span+span{color:#FE550C}
.jbf-timer,.jbf-ended{margin-top:1.6cqw;width:47cqw}
.jbf-timer{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1.6cqw}
.jbf-box{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.25cqw;height:5.4cqw;border-radius:.6cqw;background:#FE550C;color:#000}
.jbf-num{font-family:'Ubuntu',Arial,sans-serif;font-weight:700;font-size:3.9cqw;line-height:.9;font-variant-numeric:tabular-nums}
.jbf-lbl{font-weight:700;font-size:max(9px,1.1cqw);line-height:1;text-transform:uppercase}
.jbf-ended{display:flex;flex-direction:column;justify-content:center;gap:.6cqw;height:5.4cqw;padding:0 2cqw;border-radius:.6cqw;background:#FE550C;color:#000}
.jbf-ended b{font-family:'Ubuntu',Arial,sans-serif;font-weight:700;font-size:3cqw;line-height:.95;text-transform:uppercase}
.jbf-ended span{font-weight:700;font-size:1.4cqw}

.jbf-dream{margin-top:2.2cqw;width:47cqw;display:flex;align-items:center;gap:2.2cqw}
.jbf-dream p{flex:1 1 auto;margin:0;font-size:max(10.5px,1.1cqw);line-height:1.35}
.jbf-dream strong{display:block;margin-bottom:.2cqw;color:#FE550C;font-size:max(11.5px,1.2cqw)}
.jbf-cta{flex:0 0 auto;display:inline-flex;align-items:center;gap:1cqw;padding:1.15cqw 2cqw;border-radius:999px;background:#fff;color:#000;font-weight:700;font-size:max(10.5px,1.1cqw);line-height:1;text-decoration:none;text-transform:uppercase;white-space:nowrap}
.jbf-cta svg{width:1.3cqw;height:1.3cqw}
.jbf-cta:hover,.jbf-cta:focus-visible{background:#FE550C}
.jbf-cta:focus-visible{outline:3px solid #fff;outline-offset:2px}

/* Narrow (< 900px): gifts stay on the right as a column beside the text */
@container (max-width:899px){
  .jbf-main{height:auto;width:62%;padding:22px 0 22px 18px}
  .jbf-tag{padding:6px 12px 5px;font-size:11px}
  .jbf-title{margin-top:12px;font-size:calc(5.9cqw - 2px)}
  .jbf-timer,.jbf-ended,.jbf-dream{width:100%}
  .jbf-timer{margin-top:14px;gap:12px}
  .jbf-box{height:auto;padding:6px 2px;gap:2px;border-radius:8px}
  .jbf-num{font-size:clamp(22px,5.6cqw,40px)}
  .jbf-lbl{font-size:clamp(9px,1.6cqw,12px)}
  .jbf-ended{margin-top:14px;height:auto;padding:14px;border-radius:8px}
  .jbf-ended b{font-size:22px}
  .jbf-ended span{font-size:13px}

<script>
(function () {
  var root = document.querySelector('.jbf');
  // Morocco time (UTC+1). Change data-target above to move the date.
  var target = new Date(root.getAttribute('data-target')).getTime();
  var timer = root.querySelector('.jbf-timer');
  var ended = root.querySelector('.jbf-ended');
  var dream = root.querySelector('.jbf-dream');
  var el = {};
  ['d', 'h', 'm', 's'].forEach(function (u) { el[u] = root.querySelector('[data-u="' + u + '"]'); });
  function p(n) { return n < 10 ? '0' + n : String(n); }
  function tick() {
    var diff = Math.max(0, (isNaN(target) ? 0 : target) - Date.now());
    if (diff <= 0) {
      timer.hidden = true;
      ended.hidden = false;
      dream.hidden = true;
      clearInterval(id);
      return;
    }
    var s = Math.floor(diff / 1000);
    el.d.textContent = p(Math.floor(s / 86400));
    el.h.textContent = p(Math.floor(s / 3600) % 24);
    el.m.textContent = p(Math.floor(s / 60) % 60);
    el.s.textContent = p(s % 60);
  }
  var id = setInterval(tick, 1000);
  tick();
})();
</script>
